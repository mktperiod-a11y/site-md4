<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>페이지를 찾을 수 없습니다 | 모리디</title>
    <link rel="icon" href="https://site-url.invalid/favicon.svg" type="image/svg+xml" />
    <style>
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: #102a2e;
        color: #fff;
        font-family: Arial, "Noto Sans KR", sans-serif;
        word-break: keep-all;
      }
      main {
        width: min(480px, calc(100% - 40px));
        text-align: center;
      }
      b {
        color: #74e2cd;
        font-family: Georgia, serif;
        font-size: 64px;
      }
      h1 {
        margin: 12px 0;
        font-size: 24px;
      }
      p {
        color: #b8ccca;
        font-size: 15px;
        line-height: 1.7;
      }
      a {
        display: inline-block;
        margin-top: 16px;
        padding: 14px 20px;
        border-radius: 7px;
        background: #22c5a5;
        color: #102a2e;
        font-size: 14px;
        font-weight: 900;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #f6b26b;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <b>404</b>
      <h1>페이지를 찾을 수 없습니다</h1>
      <p>주소가 바뀌었거나 없어진 페이지입니다. 첫 화면에서 최신 순위를 확인해 주세요.</p>
      <a href="https://site-url.invalid/">웹하드 순위 보러 가기</a>
    </main>
  </body>
</html>
